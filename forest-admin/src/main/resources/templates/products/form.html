<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('维护商品')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container">
  <div class="page-heading"><a class="text-link" th:href="@{/products}">← 商品管理</a><h1 th:text="${id == null ? '新增生态补给' : '编辑生态补给'}"></h1><p class="muted">商品资料与库存分别维护，历史订单保留成交快照。</p></div>
  <div class="admin-detail-grid"><form class="panel admin-form" th:object="${form}" th:action="${id == null} ? @{/products/new} : @{/products/{id}/edit(id=${id})}" method="post" data-once-submit>
    <div th:replace="~{fragments/layout :: errors}"></div><input type="hidden" th:field="*{version}">
    <div class="form-grid"><div class="admin-field"><label for="sku">商品 SKU</label><input id="sku" th:field="*{sku}" required maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,39}" th:readonly="${id != null}"><small class="muted">SKU 创建后固定。</small></div>
      <div class="admin-field"><label for="categoryId">二级分类</label><select id="categoryId" th:field="*{categoryId}" required><option value="">请选择</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="|${category.name} (#${category.id})|"></option></select></div>
      <div class="admin-field full-field"><label for="name">商品名称</label><input id="name" th:field="*{name}" required maxlength="120"></div>
      <div class="admin-field"><label for="price">销售单价（元）</label><input id="price" th:field="*{price}" type="number" min="0.01" max="9999999999.99" step="0.01" required></div><div class="admin-field"><label for="sortOrder">显示排序</label><input id="sortOrder" th:field="*{sortOrder}" type="number" min="0" max="1000000" required></div>
      <div class="admin-field full-field"><label for="summary">商品简介</label><textarea id="summary" th:field="*{summary}" maxlength="500" rows="2"></textarea></div>
      <div class="admin-field full-field"><label for="description">商品详情</label><textarea id="description" th:field="*{description}" maxlength="16000" rows="6"></textarea></div>
      <div class="admin-field full-field"><label for="coverImage">封面图片路径</label><input id="coverImage" th:field="*{coverImage}" maxlength="255" required data-cover-input><small class="muted">使用两端静态 images 目录内的图片，如 /images/terrarium.svg。</small></div>
      <div class="admin-field full-field"><label for="images">相册图片路径（每行一个，最多 8 张）</label><textarea id="images" th:field="*{images}" rows="3" maxlength="2200" placeholder="/images/terrarium.svg"></textarea></div>
      <div class="admin-field" th:if="${id == null}"><label for="initialStock">初始库存</label><input id="initialStock" th:field="*{initialStock}" type="number" min="0" max="2000000000" required></div>
    </div><button class="button" type="submit">保存商品资料</button>
  </form>
  <aside><section class="panel"><h2>封面预览</h2><img class="admin-cover" data-cover-preview th:src="${form.coverImage}" alt="商品封面预览" width="320" height="240"></section>
    <section class="panel" th:if="${product != null}"><h2>销售与库存</h2><p><span class="status-badge" th:text="${product.status.name() == 'ON_SALE' ? '已上架' : '未上架'}"></span></p><p>当前库存 <strong class="price" th:text="${product.stock}"></strong></p><small class="muted" th:text="|数据版本 ${product.version}|"></small>
      <form th:action="@{/products/{id}/status(id=${id})}" method="post" data-once-submit><input type="hidden" name="version" th:value="${product.version}"><input type="hidden" name="status" th:value="${product.status.name() == 'ON_SALE' ? 'DRAFT' : 'ON_SALE'}"><button class="button full-button" type="submit" th:text="${product.status.name() == 'ON_SALE' ? '下架商品' : '上架商品'}"></button></form>
      <form th:action="@{/products/{id}/restock(id=${id})}" method="post" data-once-submit><input type="hidden" name="version" th:value="${product.version}"><div class="admin-field"><label for="restock">新增补货数量</label><input id="restock" name="quantity" type="number" min="1" max="1000000" required></div><button class="button secondary full-button" type="submit">增加库存</button></form>
      <form th:action="@{/products/{id}/delete(id=${id})}" method="post" data-once-submit data-confirm="删除这件商品？只有已下架且没有购物车或订单引用的商品可以删除。"><input type="hidden" name="version" th:value="${product.version}"><button class="button danger full-button" type="submit">删除商品</button></form>
    </section><p class="notice" th:if="${id == null}">新增商品先保存为未上架状态，检查资料后再上架。</p>
  </aside></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
