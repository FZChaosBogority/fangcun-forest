<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${title} · 方寸森林管理端|"></title><link rel="icon" type="image/png" th:href="@{/images/forest-mascot.png}">
  <link rel="stylesheet" th:href="@{/css/forest.css}"><script defer th:src="@{/js/admin.js}"></script>
</head>
<body>
<header th:fragment="header" class="site-header">
  <div class="container header-inner">
    <a class="brand" th:href="@{/}"><img class="brand-mascot" th:src="@{/images/forest-mascot.png}" width="48" height="48" alt="盆栽少女小树">
      <span>方寸森林<small>管理工作台</small></span></a>
    <nav aria-label="管理导航"><a th:href="@{/}">概览</a><a th:href="@{/products}">商品</a><a th:href="@{/categories}">分类</a><a th:href="@{/users}">用户</a><a th:href="@{/orders}">订单</a></nav>
    <div class="admin-nav-account" th:if="${currentAdmin != null}"><span th:text="${currentAdmin.displayName}"></span><form th:action="@{/logout}" method="post"><button class="small-button" type="submit">退出</button></form></div>
  </div>
  <div class="container"><p class="notice" role="status" th:if="${success != null}" th:text="${success}"></p><p class="notice error-notice" role="alert" th:if="${error != null}" th:text="${error}"></p></div>
</header>
<div th:fragment="errors" class="notice error-notice" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div>
<footer th:fragment="footer" class="site-footer container">方寸森林 · 生态补给管理工作台</footer>
</body>
</html>
