<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理概览 · 方寸森林</title><link rel="stylesheet" th:href="@{/css/forest.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <div class="page-heading"><p class="eyebrow">FOREST WORKSPACE</p><h1>生态补给工作台</h1>
    <p>从一份补给，到一片森林。</p></div>
  <p th:replace="~{fragments/layout :: notice}"></p>
  <section class="metrics" aria-label="当前数据库概览">
    <article><span>商品分类（含两级）</span><strong th:text="${summary.categories}">0</strong></article>
    <article><span>全部商品</span><strong th:text="${summary.products}">0</strong></article>
    <article><span>已上架商品</span><strong th:text="${summary.onSale}">0</strong></article>
    <article><span>订单总数</span><strong th:text="${summary.orders}">0</strong></article>
  </section>
  <section class="panel"><h2>补给目录</h2><p>查看商品的分类、价格、库存和当前状态。</p>
    <div class="actions"><a class="button" th:href="@{/products}">查看商品</a>
    <a class="button secondary" th:href="@{/categories}">查看分类</a></div></section>
</main>
</body>
</html>
