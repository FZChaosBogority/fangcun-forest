<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品分类 · 方寸森林</title><link rel="stylesheet" th:href="@{/css/forest.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <div class="page-heading"><h1>商品分类</h1></div>
  <p th:replace="~{fragments/layout :: notice}"></p>
  <div class="table-wrap"><table><caption class="sr-only">两级分类目录</caption>
    <thead><tr><th>编号</th><th>分类编码</th><th>名称</th><th>层级</th><th>父分类编号</th><th>排序</th></tr></thead>
    <tbody><tr th:each="category : ${categories}">
      <td th:text="${category.id}"></td><td th:text="${category.code}"></td><td th:text="${category.name}"></td>
      <td th:text="${category.parentId == null ? '一级' : '二级'}"></td>
      <td th:text="${category.parentId ?: '—'}"></td><td th:text="${category.sortOrder}"></td>
    </tr></tbody>
  </table></div>
  <p class="empty-state" th:if="${#lists.isEmpty(categories)}">暂无商品分类。</p>
</main>
</body>
</html>
