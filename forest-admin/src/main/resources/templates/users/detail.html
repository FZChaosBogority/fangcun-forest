<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('用户资料')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container">
  <div class="page-heading"><a class="text-link" th:href="@{/users}">← 用户管理</a><h1 th:text="${user.displayName}"></h1><p class="muted" th:text="|账号 ${user.username} · ID ${user.id}|"></p></div>
  <div class="admin-detail-grid" th:if="${user.role.name() == 'CUSTOMER'}"><form class="panel admin-form" th:object="${form}" th:action="@{/users/{id}/edit(id=${user.id})}" method="post" data-once-submit><h2>账号资料</h2><div th:replace="~{fragments/layout :: errors}"></div><input type="hidden" th:field="*{revision}">
    <div class="admin-field"><label for="displayName">昵称</label><input id="displayName" th:field="*{displayName}" required maxlength="50"></div><div class="admin-field"><label for="email">邮箱</label><input id="email" th:field="*{email}" type="email" maxlength="120"></div><div class="admin-field"><label for="phone">电话</label><input id="phone" th:field="*{phone}" type="tel" maxlength="20"></div><div class="admin-field"><label for="status">账号状态</label><select id="status" th:field="*{status}"><option value="ENABLED">启用</option><option value="DISABLED">禁用</option></select></div><button class="button" type="submit">保存资料</button></form>
    <aside><form class="panel admin-form" th:object="${passwordForm}" th:action="@{/users/{id}/reset-password(id=${user.id})}" method="post" data-password-form data-once-submit data-confirm="确认重置这个商城用户的密码？旧登录会话将在下次请求时失效。"><h2>重置密码</h2><div th:replace="~{fragments/layout :: errors}"></div><input id="passwordRevision" type="hidden" th:field="*{revision}"><div class="admin-field"><label for="newPassword">新密码</label><input id="newPassword" name="password" type="password" required minlength="8" maxlength="64" autocomplete="new-password"></div><div class="admin-field"><label for="confirmPassword">再次输入</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" maxlength="64" autocomplete="new-password"></div><p class="muted fine-print">8—64 个字符，UTF-8 最多 72 字节；保存后不回显密码。</p><button class="button secondary" type="submit">重置密码</button></form>
      <a class="button secondary full-button" th:href="@{/orders(userId=${user.id})}">查看该用户订单</a></aside></div>
  <section class="panel" th:unless="${user.role.name() == 'CUSTOMER'}"><h2>管理员账号</h2><p>角色与管理员密码在此页面保持只读。</p><p th:text="|状态：${user.status}|"></p></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
