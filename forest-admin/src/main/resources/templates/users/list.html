<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('用户管理')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container">
  <div class="page-heading"><p class="eyebrow">FOREST PEOPLE</p><h1>用户管理</h1><p class="muted">查看账号资料，维护商城用户状态与密码。</p></div>
  <form class="search-bar" th:action="@{/users}" method="get"><label for="keyword">账号 / 昵称 / 邮箱</label><input id="keyword" name="keyword" type="search" maxlength="120" th:value="${keyword}"><select name="status" aria-label="账号状态"><option value="">全部状态</option><option value="ENABLED" th:selected="${status != null and status.name() == 'ENABLED'}">启用</option><option value="DISABLED" th:selected="${status != null and status.name() == 'DISABLED'}">禁用</option></select><button class="button" type="submit">查询</button><a th:href="@{/users}">清空</a></form>
  <p class="muted" th:text="|共 ${result.total} 个账号|"></p><div class="table-wrap"><table><thead><tr><th>ID</th><th>账号</th><th>昵称</th><th>角色</th><th>状态</th><th>邮箱</th><th>操作</th></tr></thead><tbody><tr th:each="user : ${result.records}"><td th:text="${user.id}"></td><td th:text="${user.username}"></td><td th:text="${user.displayName}"></td><td th:text="${user.role.name() == 'ADMIN' ? '管理员' : '商城用户'}"></td><td th:text="${user.status.name() == 'ENABLED' ? '启用' : '禁用'}"></td><td th:text="${user.email ?: '—'}"></td><td><a class="text-link" th:href="@{/users/{id}(id=${user.id})}">查看 / 维护</a></td></tr></tbody></table></div>
  <p class="empty-state" th:if="${#lists.isEmpty(result.records)}">没有找到匹配的用户。</p><nav class="pagination" th:if="${result.total > 0}" aria-label="用户分页"><a th:if="${result.current > 1}" th:href="@{/users(keyword=${keyword},status=${status},page=${result.current - 1})}">上一页</a><span th:text="|第 ${result.current} 页 / 共 ${result.pages} 页|"></span><a th:if="${result.current < result.pages}" th:href="@{/users(keyword=${keyword},status=${status},page=${result.current + 1})}">下一页</a></nav>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
