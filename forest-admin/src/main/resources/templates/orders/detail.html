<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('处理订单')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container">
  <div class="page-heading"><a class="text-link" th:href="@{/orders}">← 订单管理</a><h1>一份绿意的旅程</h1><p class="order-number muted" th:text="${order.orderNo}"></p><span class="status-badge" th:text="${order.status.label}"></span></div>
  <section class="panel"><div class="section-heading"><h2>订单商品与金额</h2><a class="text-link" th:href="@{/users/{id}(id=${customer.id})}" th:text="|购买人：${customer.username}|"></a></div><div class="table-wrap"><table><thead><tr><th>商品快照</th><th>SKU</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody><tr th:each="item : ${items}"><td th:text="${item.productNameSnapshot}"></td><td th:text="${item.skuSnapshot}"></td><td th:text="|¥${#numbers.formatDecimal(item.unitPrice, 1, 2)}|"></td><td th:text="${item.quantity}"></td><td th:text="|¥${#numbers.formatDecimal(item.lineAmount, 1, 2)}|"></td></tr></tbody></table></div><p class="order-total">合计 <strong class="price" th:text="|¥${#numbers.formatDecimal(order.totalAmount, 1, 2)}|"></strong></p><p class="muted fine-print">商品与金额为成交快照，管理操作不改写已成交价格。</p></section>
  <div class="admin-detail-grid"><section class="panel"><h2>收货信息</h2>
    <form th:if="${order.status.name() == 'PENDING_PAYMENT' or order.status.name() == 'PAID'}" th:object="${form}" th:action="@{/orders/{id}/edit(id=${order.id})}" method="post" data-once-submit><div th:replace="~{fragments/layout :: errors}"></div><input type="hidden" th:field="*{version}"><div class="admin-field"><label for="receiverName">收货人</label><input id="receiverName" th:field="*{receiverName}" maxlength="50" required></div><div class="admin-field"><label for="receiverPhone">联系电话</label><input id="receiverPhone" th:field="*{receiverPhone}" type="tel" minlength="6" maxlength="20" required></div><div class="admin-field"><label for="receiverAddress">详细地址</label><textarea id="receiverAddress" th:field="*{receiverAddress}" rows="4" minlength="5" maxlength="255" required></textarea></div><button class="button" type="submit">保存收货信息</button></form>
    <div th:unless="${order.status.name() == 'PENDING_PAYMENT' or order.status.name() == 'PAID'}"><p th:text="${order.receiverName}"></p><p th:text="${order.receiverPhone}"></p><p class="description" th:text="${order.receiverAddress}"></p></div>
  </section><aside><section class="panel"><h2>处理订单</h2>
    <form th:if="${order.status.name() == 'PAID'}" th:action="@{/orders/{id}/ship(id=${order.id})}" method="post" data-once-submit data-confirm="确认这笔已付款订单已经安排发货？"><input type="hidden" name="version" th:value="${order.version}"><button class="button full-button" type="submit">确认发货</button></form>
    <form th:if="${order.status.name() == 'PENDING_PAYMENT'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" data-once-submit data-confirm="取消这笔待付款订单并归还库存？"><input type="hidden" name="version" th:value="${order.version}"><button class="button secondary full-button" type="submit">取消并归还库存</button></form>
    <form th:if="${order.status.name() == 'CANCELLED'}" th:action="@{/orders/{id}/delete(id=${order.id})}" method="post" data-once-submit data-confirm="永久删除这笔已取消订单及其明细？此操作不会再次归还库存。"><input type="hidden" name="version" th:value="${order.version}"><button class="button danger full-button" type="submit">删除已取消订单</button></form>
    <p class="muted fine-print" th:if="${order.status.name() == 'SHIPPED' or order.status.name() == 'COMPLETED'}">已发货和已完成订单保留履约记录。发货后由用户端确认收货。</p>
    <p class="fine-print" th:text="|创建：${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}|"></p><p class="fine-print" th:if="${order.paidAt != null}" th:text="|模拟支付：${#temporals.format(order.paidAt, 'yyyy-MM-dd HH:mm:ss')}|"></p><p class="fine-print order-number" th:if="${order.paymentNo != null}" th:text="|流水：${order.paymentNo}|"></p><p class="fine-print" th:if="${order.shippedAt != null}" th:text="|发货：${#temporals.format(order.shippedAt, 'yyyy-MM-dd HH:mm:ss')}|"></p><p class="fine-print" th:if="${order.completedAt != null}" th:text="|收货：${#temporals.format(order.completedAt, 'yyyy-MM-dd HH:mm:ss')}|"></p><p class="fine-print" th:if="${order.cancelledAt != null}" th:text="|取消：${#temporals.format(order.cancelledAt, 'yyyy-MM-dd HH:mm:ss')}|"></p>
  </section></aside></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
