<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('订单管理')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container">
  <div class="page-heading"><p class="eyebrow">FOREST DELIVERY</p><h1>订单管理</h1><p class="muted">从付款到发货，查看每一份绿意的去向。</p></div>
  <form class="search-bar" th:action="@{/orders}" method="get"><label for="orderNo">订单号</label><input id="orderNo" name="orderNo" type="search" maxlength="40" placeholder="输入完整订单号" th:value="${orderNo}"><label for="userId">用户 ID</label><input id="userId" name="userId" type="number" min="1" th:value="${userId}" class="short-input"><select name="status" aria-label="订单状态"><option value="">全部状态</option><option th:each="state : ${statuses}" th:value="${state}" th:text="${state.label}" th:selected="${state == status}"></option></select><input type="hidden" name="size" th:value="${result.size}"><button class="button" type="submit">查询</button><a th:href="@{/orders}">清空</a></form>
  <p class="muted" th:text="|共 ${result.total} 笔订单|"></p><div class="table-wrap"><table><thead><tr><th>订单号</th><th>用户</th><th>状态</th><th>金额</th><th>创建时间</th><th>操作</th></tr></thead><tbody><tr th:each="order : ${result.records}"><td class="order-number" th:text="${order.orderNo}"></td><td><a class="text-link" th:href="@{/users/{id}(id=${order.userId})}" th:text="|#${order.userId}|"></a></td><td><span class="status-badge" th:text="${order.status.label}"></span></td><td class="nowrap" th:text="|¥${#numbers.formatDecimal(order.totalAmount, 1, 2)}|"></td><td class="nowrap" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></td><td><a class="text-link" th:href="@{/orders/{id}(id=${order.id})}">详情 / 处理</a></td></tr></tbody></table></div>
  <p class="empty-state" th:if="${#lists.isEmpty(result.records)}">没有找到匹配的订单。</p><nav class="pagination" th:if="${result.total > 0}" aria-label="订单分页"><a th:if="${result.current > 1}" th:href="@{/orders(orderNo=${orderNo},userId=${userId},status=${status},page=${result.current - 1},size=${result.size})}">上一页</a><span th:text="|第 ${result.current} 页 / 共 ${result.pages} 页|"></span><a th:if="${result.current < result.pages}" th:href="@{/orders(orderNo=${orderNo},userId=${userId},status=${status},page=${result.current + 1},size=${result.size})}">下一页</a></nav>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
