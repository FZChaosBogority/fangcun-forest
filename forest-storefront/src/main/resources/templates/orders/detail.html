<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>订单详情 · 方寸森林</title><link rel="icon" type="image/png" th:href="@{/images/forest-mascot.png}"><link rel="stylesheet" th:href="@{/css/forest.css}">
  <link rel="stylesheet" href="/css/page-transitions.css" th:href="@{/css/page-transitions.css}">
  <link rel="stylesheet" href="/css/store-transitions.css" th:href="@{/css/store-transitions.css}">
  <script src="/js/page-transition.js" th:src="@{/js/page-transition.js}" data-store-transitions></script>
</head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container">
  <div class="page-heading"><a class="text-link" th:href="@{/orders}">← 我的订单</a><h1>一份绿意的旅程</h1><p class="muted order-number" th:text="${order.orderNo}"></p></div>
  <section class="panel order-status-panel"><div><span class="status-badge" th:text="${order.status.label}"></span>
    <p th:if="${order.status.name() == 'PENDING_PAYMENT'}">订单已提交，可以继续支付，也可以取消并归还库存。</p><p th:if="${order.status.name() == 'PAID'}">模拟支付已完成，等待商家发货。</p><p th:if="${order.status.name() == 'CANCELLED'}">订单已取消，预留的库存已归还。</p><p th:if="${order.status.name() == 'SHIPPED'}">补给已出发，收到后可以确认收货。</p><p th:if="${order.status.name() == 'COMPLETED'}">这份绿意已经到达，感谢你的选择。</p></div>
    <div class="actions"><a class="button" th:if="${order.status.name() == 'PENDING_PAYMENT'}" th:href="@{/orders/{id}/pay(id=${order.id})}">前往模拟支付</a><form th:if="${order.status.name() == 'PENDING_PAYMENT'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" data-confirm="取消这笔订单并归还库存？" data-once-submit><button class="button secondary" type="submit">取消订单</button></form><form th:if="${order.status.name() == 'SHIPPED'}" th:action="@{/orders/{id}/complete(id=${order.id})}" method="post" data-confirm="确认已收到这份补给？" data-once-submit><button class="button" type="submit">确认收货</button></form></div>
  </section>
  <div class="checkout-layout"><section class="panel"><h2>订单商品</h2><div class="checkout-line" th:each="item : ${items}"><img th:src="${item.coverImageSnapshot}" th:alt="${item.productNameSnapshot}" width="64" height="64"><div><strong th:text="${item.productNameSnapshot}"></strong><small th:text="|${item.skuSnapshot} · ¥${#numbers.formatDecimal(item.unitPrice, 1, 2)} × ${item.quantity}|"></small></div><span th:text="|¥${#numbers.formatDecimal(item.lineAmount, 1, 2)}|"></span></div><div class="money-row"><span th:text="${order.status.amountLabel}">订单金额</span><strong class="price" th:text="|¥${#numbers.formatDecimal(order.totalAmount, 1, 2)}|"></strong></div></section>
    <section class="panel"><h2>收货信息</h2><p th:text="${order.receiverName}"></p><p th:text="${order.receiverPhone}"></p><p class="description" th:text="${order.receiverAddress}"></p><hr><p class="fine-print" th:text="|创建时间：${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm:ss')}|"></p><div th:if="${order.paidAt != null}"><p class="fine-print" th:text="|模拟支付时间：${#temporals.format(order.paidAt, 'yyyy-MM-dd HH:mm:ss')}|"></p><p class="fine-print order-number" th:text="|支付流水：${order.paymentNo}|"></p></div><p class="fine-print" th:if="${order.cancelledAt != null}" th:text="|取消时间：${#temporals.format(order.cancelledAt, 'yyyy-MM-dd HH:mm:ss')}|"></p><p class="fine-print" th:if="${order.shippedAt != null}" th:text="|发货时间：${#temporals.format(order.shippedAt, 'yyyy-MM-dd HH:mm:ss')}|"></p><p class="fine-print" th:if="${order.completedAt != null}" th:text="|收货时间：${#temporals.format(order.completedAt, 'yyyy-MM-dd HH:mm:ss')}|"></p></section></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
