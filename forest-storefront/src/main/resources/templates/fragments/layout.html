<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="site-header">
  <div class="container header-inner">
    <a class="brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">森</span>
      <span>方寸森林<small>FANGCUN FOREST</small></span></a>
    <nav aria-label="主导航"><a th:href="@{/}">首页</a><a th:href="@{/category}">探索补给</a></nav>
  </div>
</header>
<footer th:fragment="footer" class="site-footer container">方寸之间，种下一片森林。 · 桌面生态补给站</footer>
<section th:fragment="cards(items)" class="product-grid" aria-label="商品">
  <article class="product-card" th:each="item : ${items}">
    <a th:href="@{/product(id=${item.id})}">
      <img th:src="${item.coverImage}" th:alt="${item.name}" loading="lazy" width="480" height="360">
      <div class="card-body">
        <span class="tag" th:if="${item.stock == 0}">暂时售罄</span>
        <h3 th:text="${item.name}">生态补给</h3>
        <p th:text="${item.summary}">为桌面添一点绿。</p>
        <strong class="price" th:text="|¥${#numbers.formatDecimal(item.price, 1, 2)}|">¥0.00</strong>
      </div>
    </a>
  </article>
</section>
</body>
</html>
