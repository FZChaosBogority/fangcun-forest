<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/png" th:href="@{/images/forest-mascot.png}">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>探索补给 · 方寸森林</title><link rel="stylesheet" th:href="@{/css/forest.css}">
  <link rel="stylesheet" href="/css/page-transitions.css" th:href="@{/css/page-transitions.css}">
  <link rel="stylesheet" href="/css/store-transitions.css" th:href="@{/css/store-transitions.css}">
  <script src="/js/page-transition.js" th:src="@{/js/page-transition.js}" data-store-transitions></script>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <div class="page-heading"><p class="eyebrow">EXPLORE THE LITTLE WORLD</p><h1>探索生态补给</h1></div>
  <div class="catalog-layout"><aside class="catalog-sidebar" aria-label="分类导航"><h2>发现绿意</h2><a th:href="@{/category(keyword=${keyword},sort=${sort},inStock=${inStock},size=${result.size})}">全部补给</a><div th:each="rootCategory : ${rootCategories}"><a class="category-root" th:href="@{/category(categoryId=${rootCategory.id},keyword=${keyword},sort=${sort},inStock=${inStock},size=${result.size})}" th:text="${rootCategory.name}">一级分类</a><a class="category-child" th:each="child : ${categoryGroups[rootCategory.id]}" th:href="@{/category(categoryId=${child.id},keyword=${keyword},sort=${sort},inStock=${inStock},size=${result.size})}" th:text="${child.name}" th:classappend="${child.id == categoryId} ? 'active'">二级分类</a></div></aside><section class="catalog-results" aria-label="商品列表">
  <form class="search-bar" method="get" th:action="@{/category}">
    <label for="categoryId">商品分类</label>
    <select id="categoryId" name="categoryId">
      <option value="">全部分类</option>
      <option th:each="category : ${categories}" th:value="${category.id}"
              th:text="${category.parentId == null ? category.name : '↳ ' + category.name}" th:selected="${category.id == categoryId}"></option>
    </select>
    <label for="keyword">商品名称</label>
    <input id="keyword" name="keyword" type="search" maxlength="120" placeholder="搜索商品名称" th:value="${keyword}">
    <input type="hidden" name="size" th:value="${result.size}">
    <label for="sort">排序</label>
    <select id="sort" name="sort"><option th:each="option : ${sorts}" th:value="${option}" th:text="${option.label}" th:selected="${option == sort}"></option></select>
    <label class="check-label"><input type="checkbox" name="inStock" value="true" th:checked="${inStock}">仅看有货</label>
    <button class="button" type="submit">查询</button>
    <a th:href="@{/category}">清空筛选</a>
  </form>
  <p class="muted" th:text="|共 ${result.total} 件商品|"></p>
  <div th:replace="~{fragments/layout :: cards(${result.records})}"></div>
  <div class="empty-state" th:if="${#lists.isEmpty(result.records)}">
    <p>这一页没有找到商品，可以更换条件或返回第一页。</p>
    <a th:href="@{/category(categoryId=${categoryId},keyword=${keyword},sort=${sort},inStock=${inStock},page=1,size=${result.size})}">返回第一页</a>
  </div>
  <nav class="pagination" aria-label="商品分页" th:if="${result.total > 0}">
    <a th:if="${result.current > 1}" th:href="@{/category(categoryId=${categoryId},keyword=${keyword},sort=${sort},inStock=${inStock},page=${result.current - 1},size=${result.size})}">上一页</a>
    <span th:text="|第 ${result.current} 页 · 共 ${result.pages} 页|"></span>
    <a th:if="${result.current < result.pages}" th:href="@{/category(categoryId=${categoryId},keyword=${keyword},sort=${sort},inStock=${inStock},page=${result.current + 1},size=${result.size})}">下一页</a>
  </nav>
  </section></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
